[package]
name = "dark"
version = "0.0.1"
edition = "2021"
description = "Terminal review & vibe-coding workbench, < 10 MB RAM"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
